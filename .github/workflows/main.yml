 name: Bump version in module.prop
   id: bump
   run: |
    set -e

    PROP="module.prop"

    OLD_CODE=$(grep '^versionCode=' "$PROP" | cut -d= -f2)
    NEW_CODE=$(( OLD_CODE + 1 ))

    CURRENT_VERSION=$(grep '^version=' "$PROP" | cut -d= -f2)
    if [[ "$CURRENT_VERSION" =~ ^v([0-9]+)\.([0-9]+)$ ]]; then
      MAJOR="${BASH_REMATCH[1]}"
      MINOR="${BASH_REMATCH[2]}"
    else
      echo "Invalid version format: $CURRENT_VERSION (expected vMAJOR.MINOR)" >&2
      exit 1
    fi

    # Keep the minor component to one digit: v1.9 becomes v2.0.
    if (( MINOR >= 9 )); then
      NEW_MAJOR=$(( MAJOR + 1 ))
      NEW_MINOR=0
    else
      NEW_MAJOR=$MAJOR
      NEW_MINOR=$(( MINOR + 1 ))
    fi

    NEW_VER="v${NEW_MAJOR}.${NEW_MINOR}"

    sed -i "s/^version=.*/version=${NEW_VER}/"         "$PROP"
    sed -i "s/^versionCode=.*/versionCode=${NEW_CODE}/" "$PROP"

    echo "version=${NEW_VER}"       >> "$GITHUB_OUTPUT"
    echo "version_code=${NEW_CODE}" >> "$GITHUB_OUTPUT"
