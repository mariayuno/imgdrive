name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump version in module.prop
        id: bump
        shell: bash
        run: |
          set -e

          PROP="module.prop"

          OLD_CODE=$(grep '^versionCode=' "$PROP" | cut -d= -f2)
          NEW_CODE=$((OLD_CODE + 1))

          CURRENT_VERSION=$(grep '^version=' "$PROP" | cut -d= -f2)

          if [[ "$CURRENT_VERSION" =~ ^v([0-9]+)\.([0-9]+)$ ]]; then
            MAJOR="${BASH_REMATCH[1]}"
            MINOR="${BASH_REMATCH[2]}"
          else
            echo "Invalid version format: $CURRENT_VERSION"
            echo "Expected format: vMAJOR.MINOR"
            exit 1
          fi

          # Increment the minor version.
          # v1.9 becomes v2.0.
          if ((MINOR >= 9)); then
            NEW_MAJOR=$((MAJOR + 1))
            NEW_MINOR=0
          else
            NEW_MAJOR=$MAJOR
            NEW_MINOR=$((MINOR + 1))
          fi

          NEW_VERSION="v${NEW_MAJOR}.${NEW_MINOR}"

          sed -i "s/^version=.*/version=${NEW_VERSION}/" "$PROP"
          sed -i "s/^versionCode=.*/versionCode=${NEW_CODE}/" "$PROP"

          echo "version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"
          echo "version_code=${NEW_CODE}" >> "$GITHUB_OUTPUT"

      - name: Prepare release metadata
        id: meta
        shell: bash
        run: |
          VERSION="${{ steps.bump.outputs.version }}"

          echo "tag=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "name=imgdrive ${VERSION}" >> "$GITHUB_OUTPUT"
          echo "artifact=imgdrive-${VERSION}.zip" >> "$GITHUB_OUTPUT"

      - name: Update update.json
        shell: bash
        run: |
          VERSION="${{ steps.bump.outputs.version }}"
          VERSION_CODE="${{ steps.bump.outputs.version_code }}"
          ARTIFACT="${{ steps.meta.outputs.artifact }}"
          ZIP_URL="https://github.com/${{ github.repository }}/releases/download/${VERSION}/${ARTIFACT}"

          cat > update.json <<EOF
          {
            "version": "${VERSION}",
            "versionCode": ${VERSION_CODE},
            "zipUrl": "${ZIP_URL}",
            "changelog": "https://raw.githubusercontent.com/${{ github.repository }}/main/CHANGELOG.md"
          }
          EOF

      - name: Generate changelog
        id: changelog
        shell: bash
        run: |
          set -e

          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || true)

          if [ -n "$LAST_TAG" ]; then
            RANGE="${LAST_TAG}..HEAD"
          else
            RANGE="HEAD"
          fi

          LOG=$(git log "$RANGE" \
            --pretty=format:"- %s (%h)" \
            --no-merges \
            | grep -v '^- chore: bump version' || true)

          if [ -z "$LOG" ]; then
            LOG="- Minor update"
          fi

          {
            echo "## What's changed"
            echo
            echo "$LOG"
            echo
            echo "## Checksums"
            echo '```'
            echo "The SHA256 checksum is included below."
            echo '```'
            echo
            echo "Enjoy !!!"
          } > release_notes.md

          VERSION="${{ steps.bump.outputs.version }}"
          NEW_ENTRY="## ${VERSION}"$'\n\n'"${LOG}"$'\n'

          if [ -f CHANGELOG.md ]; then
            {
              echo "$NEW_ENTRY"
              cat CHANGELOG.md
            } > CHANGELOG.md.tmp
            mv CHANGELOG.md.tmp CHANGELOG.md
          else
            printf '%s\n' "$NEW_ENTRY" > CHANGELOG.md
          fi

          echo "notes_file=release_notes.md" >> "$GITHUB_OUTPUT"

      - name: Build flashable zip
        id: build
        shell: bash
        run: |
          set -e

          ZIP="${{ steps.meta.outputs.artifact }}"

          zip -q -r "$ZIP" . \
            -x ".git/*" \
            -x ".github/*" \
            -x "$ZIP" \
            -x "*.DS_Store" \
            -x "*.swp" \
            -x "*.bak"

          SHA256=$(sha256sum "$ZIP" | cut -d' ' -f1)

          sed -i "s/The SHA256 checksum is included below./SHA256  ${SHA256}  ${ZIP}/" release_notes.md

          echo "zip=${ZIP}" >> "$GITHUB_OUTPUT"
          echo "sha256=${SHA256}" >> "$GITHUB_OUTPUT"

      - name: Commit version and changelog updates
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add module.prop update.json CHANGELOG.md

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: bump version to ${{ steps.bump.outputs.version }} [skip ci]"
            git push origin HEAD:main
          fi

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          body_path: ${{ steps.changelog.outputs.notes_file }}
          files: ${{ steps.build.outputs.zip }}
          draft: false
          prerelease: false
