name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump version in module.prop
        id: bump
        shell: bash
        run: |
          set -euo pipefail

          PROP="module.prop"

          if [[ ! -f "$PROP" ]]; then
            echo "ERROR: $PROP not found."
            exit 1
          fi

          OLD_CODE=$(grep '^versionCode=' "$PROP" | cut -d= -f2)
          CURRENT_VERSION=$(grep '^version=' "$PROP" | cut -d= -f2)

          if [[ -z "$OLD_CODE" || -z "$CURRENT_VERSION" ]]; then
            echo "ERROR: Could not read version/versionCode from $PROP."
            exit 1
          fi

          if ! [[ "$OLD_CODE" =~ ^[0-9]+$ ]]; then
            echo "ERROR: Invalid versionCode: $OLD_CODE"
            exit 1
          fi

          NEW_CODE=$((OLD_CODE + 1))

          if [[ "$CURRENT_VERSION" =~ ^v([0-9]+)\.([0-9]+)$ ]]; then
            MAJOR="${BASH_REMATCH[1]}"
            MINOR="${BASH_REMATCH[2]}"
          else
            echo "ERROR: Invalid version format: $CURRENT_VERSION"
            echo "Expected format: vMAJOR.MINOR"
            exit 1
          fi

          # Increment minor version.
          # v1.9 -> v2.0
          if (( MINOR >= 9 )); then
            NEW_MAJOR=$((MAJOR + 1))
            NEW_MINOR=0
          else
            NEW_MAJOR=$MAJOR
            NEW_MINOR=$((MINOR + 1))
          fi

          NEW_VERSION="v${NEW_MAJOR}.${NEW_MINOR}"

          sed -i "s/^version=.*/version=${NEW_VERSION}/" "$PROP"
          sed -i "s/^versionCode=.*/versionCode=${NEW_CODE}/" "$PROP"

          echo "version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"
          echo "version_code=${NEW_CODE}" >> "$GITHUB_OUTPUT"

          echo "Version:     ${CURRENT_VERSION} -> ${NEW_VERSION}"
          echo "VersionCode: ${OLD_CODE} -> ${NEW_CODE}"

      - name: Prepare release metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${{ steps.bump.outputs.version }}"

          TAG="${VERSION}"
          NAME="imgdrive ${VERSION}"
          ARTIFACT="imgdrive-${VERSION}.zip"

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "artifact=${ARTIFACT}" >> "$GITHUB_OUTPUT"

          echo "Release tag:  ${TAG}"
          echo "Release name: ${NAME}"
          echo "Artifact:     ${ARTIFACT}"

      - name: Update update.json
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${{ steps.bump.outputs.version }}"
          VERSION_CODE="${{ steps.bump.outputs.version_code }}"
          ARTIFACT="${{ steps.meta.outputs.artifact }}"

          ZIP_URL="https://github.com/${{ github.repository }}/releases/download/${VERSION}/${ARTIFACT}"
          CHANGELOG_URL="https://raw.githubusercontent.com/${{ github.repository }}/main/CHANGELOG.md"

          cat > update.json <<EOF
          {
            "version": "${VERSION}",
            "versionCode": ${VERSION_CODE},
            "zipUrl": "${ZIP_URL}",
            "changelog": "${CHANGELOG_URL}"
          }
          EOF

          echo "Generated update.json:"
          cat update.json

      - name: Generate changelog
        id: changelog
        shell: bash
        run: |
          set -euo pipefail

          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || true)

          if [[ -n "$LAST_TAG" ]]; then
            RANGE="${LAST_TAG}..HEAD"
          else
            RANGE="HEAD"
          fi

          LOG=$(git log "$RANGE" \
            --pretty=format:"- %s (%h)" \
            --no-merges \
            | grep -v '^- chore: bump version' || true)

          if [[ -z "$LOG" ]]; then
            LOG="- Minor update"
          fi

          {
            echo "## What's changed"
            echo
            echo "$LOG"
            echo
            echo "## Checksums"
            echo
            echo '```'
            echo "The SHA256 checksum is included below."
            echo '```'
            echo
            echo "Enjoy !!!"
          } > release_notes.md

          VERSION="${{ steps.bump.outputs.version }}"
          NEW_ENTRY="## ${VERSION}"$'\n\n'"${LOG}"$'\n'

          if [[ -f CHANGELOG.md ]]; then
            {
              echo "$NEW_ENTRY"
              cat CHANGELOG.md
            } > CHANGELOG.md.tmp

            mv CHANGELOG.md.tmp CHANGELOG.md
          else
            printf '%s\n' "$NEW_ENTRY" > CHANGELOG.md
          fi

          echo "notes_file=release_notes.md" >> "$GITHUB_OUTPUT"

      # ---------------------------------------------------------------
      # README
      #
      # Two generated areas are maintained:
      #
      # 1. TOP VERSION BADGE
      # 2. INSTALLATION BANNER
      #
      # Everything outside those markers is left untouched.
      # ---------------------------------------------------------------

      - name: Update README version banner and install banner
        shell: bash
        run: |
          set -euo pipefail

          README="README.md"

          VERSION_START='<!-- VERSION_BADGE_START -->'
          VERSION_END='<!-- VERSION_BADGE_END -->'

          INSTALL_START='<!-- INSTALL_ONELINER_START -->'
          INSTALL_END='<!-- INSTALL_ONELINER_END -->'

          VERSION="${{ steps.bump.outputs.version }}"
          VERSION_CODE="${{ steps.bump.outputs.version_code }}"
          ARTIFACT="${{ steps.meta.outputs.artifact }}"

          RELEASE_URL="https://github.com/${{ github.repository }}/releases/download/${VERSION}/${ARTIFACT}"

          # Badge colors.
          #
          # Purple is used for the project version.
          # Blue is used for the package/download information.
          #
          VERSION_COLOR="7c3aed"
          PACKAGE_COLOR="2563eb"
          CODE_COLOR="0891b2"

          if [[ ! -f "$README" ]]; then
            echo "ERROR: $README not found."
            exit 1
          fi

          echo "Checking README markers..."

          # -------------------------------------------------------------
          # Validate VERSION markers
          # -------------------------------------------------------------

          VERSION_START_COUNT=$(grep -Fxc "$VERSION_START" "$README" || true)
          VERSION_END_COUNT=$(grep -Fxc "$VERSION_END" "$README" || true)

          if (( VERSION_START_COUNT != 1 )); then
            echo "ERROR: Expected exactly one:"
            printf '  %s\n' "$VERSION_START"
            echo "Found: $VERSION_START_COUNT"
            exit 1
          fi

          if (( VERSION_END_COUNT != 1 )); then
            echo "ERROR: Expected exactly one:"
            printf '  %s\n' "$VERSION_END"
            echo "Found: $VERSION_END_COUNT"
            exit 1
          fi

          VERSION_START_LINE=$(grep -n -F "$VERSION_START" "$README" | cut -d: -f1)
          VERSION_END_LINE=$(grep -n -F "$VERSION_END" "$README" | cut -d: -f1)

          if (( VERSION_START_LINE >= VERSION_END_LINE )); then
            echo "ERROR: Version badge markers are in the wrong order."
            exit 1
          fi

          # -------------------------------------------------------------
          # Validate INSTALL markers
          # -------------------------------------------------------------

          INSTALL_START_COUNT=$(grep -Fxc "$INSTALL_START" "$README" || true)
          INSTALL_END_COUNT=$(grep -Fxc "$INSTALL_END" "$README" || true)

          if (( INSTALL_START_COUNT != 1 )); then
            echo "ERROR: Expected exactly one:"
            printf '  %s\n' "$INSTALL_START"
            echo "Found: $INSTALL_START_COUNT"
            exit 1
          fi

          if (( INSTALL_END_COUNT != 1 )); then
            echo "ERROR: Expected exactly one:"
            printf '  %s\n' "$INSTALL_END"
            echo "Found: $INSTALL_END_COUNT"
            exit 1
          fi

          INSTALL_START_LINE=$(grep -n -F "$INSTALL_START" "$README" | cut -d: -f1)
          INSTALL_END_LINE=$(grep -n -F "$INSTALL_END" "$README" | cut -d: -f1)

          if (( INSTALL_START_LINE >= INSTALL_END_LINE )); then
            echo "ERROR: Installation markers are in the wrong order."
            exit 1
          fi

          echo "README markers OK."
          echo "  Version:      ${VERSION_START_LINE}-${VERSION_END_LINE}"
          echo "  Installation: ${INSTALL_START_LINE}-${INSTALL_END_LINE}"

          # -------------------------------------------------------------
          # Generate README
          # -------------------------------------------------------------

          TMP_README="${README}.tmp"

          awk \
            -v version_start="$VERSION_START" \
            -v version_end="$VERSION_END" \
            -v install_start="$INSTALL_START" \
            -v install_end="$INSTALL_END" \
            -v version="$VERSION" \
            -v version_code="$VERSION_CODE" \
            -v artifact="$ARTIFACT" \
            -v release_url="$RELEASE_URL" \
            -v version_color="$VERSION_COLOR" \
            -v package_color="$PACKAGE_COLOR" \
            -v code_color="$CODE_COLOR" \
            '
            # -----------------------------------------------------------
            # Top version badge
            # -----------------------------------------------------------

            $0 == version_start {
              print
              print "<img alt=\"Version\" src=\"https://img.shields.io/badge/version-" version "-" version_color "?style=flat-square&logo=github&logoColor=white\">"
              print version_end
              in_version=1
              next
            }

            $0 == version_end {
              if (in_version) {
                in_version=0
                next
              }
            }

            # -----------------------------------------------------------
            # Installation banner
            # -----------------------------------------------------------

            $0 == install_start {
              print
              print "<table>"
              print "<tr>"
              print "<td valign=\"top\" width=\"70%\">"
              print ""
              print "### One-liner(Just run it in a root shell)"
              print ""
              print "> Downloads the current release and installs it directly."
              print ""
              print "**KernelSU / APatch**"
              print ""
              print "```sh"
              print "curl -Lo /tmp/imgdrive.zip " release_url " && /data/adb/ksud module install /tmp/imgdrive.zip"
              print "```"
              print ""
              print "**Magisk**"
              print ""
              print "```sh"
              print "curl -Lo /tmp/imgdrive.zip " release_url " && magisk --install-module /tmp/imgdrive.zip"
              print "```"
              print ""
              print "**APatch**"
              print ""
              print "```sh"
              print "curl -Lo /tmp/imgdrive.zip " release_url " && /data/adb/apd module install /tmp/imgdrive.zip"
              print "```"
              print ""
              print "</td>"
              print "<td valign=\"top\" align=\"right\" width=\"30%\">"
              print ""
              print "<p align=\"right\">"
              print "<img alt=\"Version\" src=\"https://img.shields.io/badge/" version "-" version_color "?style=for-the-badge&logo=github&logoColor=white\"><br>"
              print "<img alt=\"Package\" src=\"https://img.shields.io/badge/package-" artifact "-" package_color "?style=for-the-badge&logo=files&logoColor=white\"><br>"
              print "<img alt=\"Version Code\" src=\"https://img.shields.io/badge/version%20code-" version_code "-" code_color "?style=for-the-badge\">"
              print "</p>"
              print ""
              print "</td>"
              print "</tr>"
              print "</table>"
              print ""
              in_install=1
              next
            }

            $0 == install_end {
              if (in_install) {
                in_install=0
                print
                next
              }
            }

            # -----------------------------------------------------------
            # Preserve everything outside generated sections.
            # -----------------------------------------------------------

            !in_version && !in_install {
              print
            }
            ' "$README" > "$TMP_README"

          mv "$TMP_README" "$README"

          echo "README updated successfully."

      - name: Verify README generated content
        shell: bash
        run: |
          set -euo pipefail

          README="README.md"

          VERSION_START='<!-- VERSION_BADGE_START -->'
          VERSION_END='<!-- VERSION_BADGE_END -->'

          INSTALL_START='<!-- INSTALL_ONELINER_START -->'
          INSTALL_END='<!-- INSTALL_ONELINER_END -->'

          VERSION="${{ steps.bump.outputs.version }}"
          VERSION_CODE="${{ steps.bump.outputs.version_code }}"
          ARTIFACT="${{ steps.meta.outputs.artifact }}"

          RELEASE_URL="https://github.com/${{ github.repository }}/releases/download/${VERSION}/${ARTIFACT}"

          echo "Verifying README..."

          # -------------------------------------------------------------
          # Marker counts
          # -------------------------------------------------------------

          [[ "$(grep -Fxc "$VERSION_START" "$README" || true)" == "1" ]] \
            || { echo "ERROR: Invalid version start marker."; exit 1; }

          [[ "$(grep -Fxc "$VERSION_END" "$README" || true)" == "1" ]] \
            || { echo "ERROR: Invalid version end marker."; exit 1; }

          [[ "$(grep -Fxc "$INSTALL_START" "$README" || true)" == "1" ]] \
            || { echo "ERROR: Invalid install start marker."; exit 1; }

          [[ "$(grep -Fxc "$INSTALL_END" "$README" || true)" == "1" ]] \
            || { echo "ERROR: Invalid install end marker."; exit 1; }

          # -------------------------------------------------------------
          # Version banner
          # -------------------------------------------------------------

          VERSION_START_LINE=$(grep -n -F "$VERSION_START" "$README" | cut -d: -f1)
          VERSION_END_LINE=$(grep -n -F "$VERSION_END" "$README" | cut -d: -f1)

          VERSION_SECTION=$(sed -n "${VERSION_START_LINE},${VERSION_END_LINE}p" "$README")

          if ! grep -Fq "version-${VERSION}" <<< "$VERSION_SECTION"; then
            echo "ERROR: Top version badge is stale."
            echo "Expected version: $VERSION"
            exit 1
          fi

          # -------------------------------------------------------------
          # Installation banner
          # -------------------------------------------------------------

          INSTALL_START_LINE=$(grep -n -F "$INSTALL_START" "$README" | cut -d: -f1)
          INSTALL_END_LINE=$(grep -n -F "$INSTALL_END" "$README" | cut -d: -f1)

          INSTALL_SECTION=$(sed -n "${INSTALL_START_LINE},${INSTALL_END_LINE}p" "$README")

          if ! grep -Fq "$RELEASE_URL" <<< "$INSTALL_SECTION"; then
            echo "ERROR: Installation URL is stale."
            echo "Expected:"
            echo "$RELEASE_URL"
            exit 1
          fi

          if ! grep -Fq "curl -Lo /tmp/imgdrive.zip" <<< "$INSTALL_SECTION"; then
            echo "ERROR: curl installer is missing."
            exit 1
          fi

          if ! grep -Fq "/data/adb/ksud module install /tmp/imgdrive.zip" <<< "$INSTALL_SECTION"; then
            echo "ERROR: KernelSU installer is missing."
            exit 1
          fi

          if ! grep -Fq "magisk --install-module /tmp/imgdrive.zip" <<< "$INSTALL_SECTION"; then
            echo "ERROR: Magisk installer is missing."
            exit 1
          fi

          if ! grep -Fq "/data/adb/apd module install /tmp/imgdrive.zip" <<< "$INSTALL_SECTION"; then
            echo "ERROR: APatch installer is missing."
            exit 1
          fi

          if ! grep -Fq "$ARTIFACT" <<< "$INSTALL_SECTION"; then
            echo "ERROR: README does not contain expected package name:"
            echo "$ARTIFACT"
            exit 1
          fi

          if ! grep -Fq "$VERSION_CODE" <<< "$INSTALL_SECTION"; then
            echo "ERROR: README does not contain expected version code:"
            echo "$VERSION_CODE"
            exit 1
          fi

          echo "README verification passed."

      - name: Build flashable zip
        id: build
        shell: bash
        run: |
          set -euo pipefail

          ZIP="${{ steps.meta.outputs.artifact }}"

          zip -q -r "$ZIP" . \
            -x ".git/*" \
            -x ".github/*" \
            -x "$ZIP" \
            -x "*.DS_Store" \
            -x "*.swp" \
            -x "*.bak"

          SHA256=$(sha256sum "$ZIP" | cut -d' ' -f1)

          sed -i \
            "s/The SHA256 checksum is included below\./SHA256  ${SHA256}  ${ZIP}/" \
            release_notes.md

          echo "zip=${ZIP}" >> "$GITHUB_OUTPUT"
          echo "sha256=${SHA256}" >> "$GITHUB_OUTPUT"

          echo "Built:  $ZIP"
          echo "SHA256: $SHA256"

      - name: Final consistency check
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${{ steps.bump.outputs.version }}"
          VERSION_CODE="${{ steps.bump.outputs.version_code }}"
          ARTIFACT="${{ steps.meta.outputs.artifact }}"

          echo "Running final consistency checks..."

          # -------------------------------------------------------------
          # module.prop
          # -------------------------------------------------------------

          ACTUAL_VERSION=$(grep '^version=' module.prop | cut -d= -f2)
          ACTUAL_VERSION_CODE=$(grep '^versionCode=' module.prop | cut -d= -f2)

          if [[ "$ACTUAL_VERSION" != "$VERSION" ]]; then
            echo "ERROR: module.prop version mismatch."
            echo "Expected: $VERSION"
            echo "Actual:   $ACTUAL_VERSION"
            exit 1
          fi

          if [[ "$ACTUAL_VERSION_CODE" != "$VERSION_CODE" ]]; then
            echo "ERROR: module.prop versionCode mismatch."
            echo "Expected: $VERSION_CODE"
            echo "Actual:   $ACTUAL_VERSION_CODE"
            exit 1
          fi

          # -------------------------------------------------------------
          # update.json
          # -------------------------------------------------------------

          if ! grep -Fq "\"version\": \"${VERSION}\"" update.json; then
            echo "ERROR: update.json version mismatch."
            exit 1
          fi

          if ! grep -Fq "\"versionCode\": ${VERSION_CODE}" update.json; then
            echo "ERROR: update.json versionCode mismatch."
            exit 1
          fi

          # -------------------------------------------------------------
          # Artifact
          # -------------------------------------------------------------

          if [[ ! -f "$ARTIFACT" ]]; then
            echo "ERROR: Expected release artifact does not exist:"
            echo "$ARTIFACT"
            exit 1
          fi

          # -------------------------------------------------------------
          # README
          # -------------------------------------------------------------

          if ! grep -Fq "$VERSION" README.md; then
            echo "ERROR: README does not reference current version."
            exit 1
          fi

          if ! grep -Fq "$ARTIFACT" README.md; then
            echo "ERROR: README does not reference current artifact."
            exit 1
          fi

          echo "All consistency checks passed."

      - name: Commit version, changelog and README updates
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add \
            module.prop \
            update.json \
            CHANGELOG.md \
            README.md

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit \
              -m "chore: bump version to ${{ steps.bump.outputs.version }} [skip ci]"

            git push origin HEAD:main
          fi

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          body_path: ${{ steps.changelog.outputs.notes_file }}
          files: ${{ steps.build.outputs.zip }}
          draft: false
          prerelease: false
