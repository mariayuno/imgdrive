name: Release

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/**'
      - '*.md'
      - 'LICENSE'
      - '.gitignore'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── Bump version ────────────────────────────────────────────────
      - name: Bump version in module.prop
        id: bump
        run: |
          set -e

          PROP="module.prop"

          OLD_CODE=$(grep '^versionCode=' "$PROP" | cut -d= -f2)
          NEW_CODE=$(( OLD_CODE + 1 ))

          MAJOR=$(grep '^version=' "$PROP" | sed 's/^version=v\([0-9]*\)\..*/\1/')
          NEW_VER="v${MAJOR}.${NEW_CODE}"

          sed -i "s/^version=.*/version=${NEW_VER}/"         "$PROP"
          sed -i "s/^versionCode=.*/versionCode=${NEW_CODE}/" "$PROP"

          echo "version=${NEW_VER}"       >> "$GITHUB_OUTPUT"
          echo "version_code=${NEW_CODE}" >> "$GITHUB_OUTPUT"

          echo "Bumped: v${MAJOR}.$((OLD_CODE)) -> ${NEW_VER} (versionCode ${NEW_CODE})"

      # ── Build zip ───────────────────────────────────────────────────
      - name: Build flashable zip
        id: build
        run: |
          set -e

          VERSION="${{ steps.bump.outputs.version }}"
          ZIP="imgdrive-${VERSION}.zip"

          zip -q -r "$ZIP" . \
            --exclude "*.git/*" \
            --exclude ".github/*" \
            --exclude "*.DS_Store" \
            --exclude "*.swp" \
            --exclude "*.bak"

          zip -q "$ZIP" README.md LICENSE

          SHA256=$(sha256sum "$ZIP" | cut -d' ' -f1)

          echo "zip=${ZIP}"       >> "$GITHUB_OUTPUT"
          echo "sha256=${SHA256}" >> "$GITHUB_OUTPUT"

          echo "Built: $ZIP  ($SHA256)"

      # ── Commit bumped module.prop ────────────────────────────────────
      - name: Commit version bump
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin git@github.com:rexackermann/imgdrive.git
          git add module.prop
          git commit -m "chore: bump version to ${{ steps.bump.outputs.version }} [skip ci]"
          git push

      # ── Generate changelog ───────────────────────────────────────────
      - name: Generate changelog
        id: changelog
        run: |
          set -e

          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")

          if [ -n "$LAST_TAG" ]; then
            RANGE="${LAST_TAG}..HEAD"
          else
            RANGE="HEAD"
          fi

          LOG=$(git log "$RANGE" \
            --pretty=format:"- %s (%h)" \
            --no-merges \
            | grep -v '^\- chore: bump version' || true)

          [ -z "$LOG" ] && LOG="- Minor update"

          {
            echo "## What's changed"
            echo ""
            echo "$LOG"
            echo ""
            echo "## Checksums"
            echo '```'
            echo "SHA256  ${{ steps.build.outputs.sha256 }}  ${{ steps.build.outputs.zip }}"
            echo '```'
          } > release_notes.md

          echo "notes_file=release_notes.md" >> "$GITHUB_OUTPUT"

      # ── Create GitHub release ────────────────────────────────────────
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.bump.outputs.version }}
          name: imgdrive ${{ steps.bump.outputs.version }}
          body_path: ${{ steps.changelog.outputs.notes_file }}
          files: ${{ steps.build.outputs.zip }}
          draft: false
          prerelease: false
